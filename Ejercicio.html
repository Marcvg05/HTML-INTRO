<!DOCTYPE html>
<html>
<head>
    <title>Ejercicio de JS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body>
<div class="container">
  <h2>Ejercicio de JS</h2>
  <p>Queremos ver un resumen de repositorios de GitHub del usuario.</p>
  <form>
    <div class="form-group">
      <label for="usr">Nombre de usuario de github:</label>
      <input type="text" class="form-control" id="usr" placeholder="Ej: facebook">
    </div>
  </form>

  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Lenguaje</th>
        <th>Estrellas</th>
        <th>Forks</th>
    </tr>
    </thead>
    <tbody id="tabla-repos">

    </tbody>
  </table>
  
  <div id="error-message" style="display: none;" class="alert alert-danger mt-3"></div>
  
  <input type="button" class="btn btn-primary" value="Buscar Repositorios" id="btnBuscar">
</div>

<script>
$(document).ready(function(){
  $("#btnBuscar").click(function(){
    let usuario = $("#usr").val().trim();
    
    // Validar que se haya ingresado un usuario
    if (usuario === "") {
      mostrarError("Escribe un nombre de GitHub.");
      return;
    }
    //Quitar lo que se ve de un error
    $("#error-message").hide();
    
    // Hacer la petición a la API de GitHub con ajax
    $.ajax({
      url: "https://api.github.com/users/" + usuario + "/repos",
      method: "GET",
      dataType: "json",
      success: function(data) {
        
        
        data.forEach(function(repo) {
          let fila = `
            <tr>
              <td>${repo.name}</td>
              <td>${repo.description || 'Sin descripción'}</td>
              <td>${repo.language || 'No especificado'}</td>
              <td>${repo.stargazers_count}</td>
              <td>${repo.forks_count}</td>
            </tr>
          `;
          $("#tabla-repos").append(fila);
        });
      },
      error: function(xhr, status, error) {
        
        if (xhr.status === 404) {
          mostrarError("Usuario no encontrado en GitHub");
        } else {
          mostrarError("Error al buscar repositorios: " + error);
        }
      }
    });
  });
  
  // Función para mostrar mensajes de error
  function mostrarError(mensaje) {
    $("#error-message").text(mensaje).show();
  }
});
</script>
</body>
</html>
